<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>LB Orders</title>
<script>
/* Always fresh (website profile): if version.json names a newer build than this page, hop once
   to ?v=<build>. A Home Screen app is rarely reloaded, so this also runs every time it comes back
   on screen. deploy.sh stamps BUILD here and in index.html together. */
var BUILD='20261024-154755';
(function(){
  if(location.protocol==='file:') return;
  function check(){
    fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
      if(!j||!j.build||j.build===BUILD) return;
      var k='lb-orders-fresh-'+j.build; try{ if(sessionStorage.getItem(k)) return; sessionStorage.setItem(k,'1'); }catch(e){}
      var u=new URL(location.href); u.searchParams.set('v',j.build); location.replace(u.toString());
    }).catch(function(){});
  }
  check();
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) check(); });
  addEventListener('pageshow',function(e){ if(e.persisted) check(); });
})();
</script>
<link rel="manifest" href="/orders.webmanifest">
<link rel="apple-touch-icon" href="/img/orders-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LB Orders">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#231812">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--roast:#231812;--roast-2:#36241a;--crema:#f6ece0;--cream:#fffaf4;--caramel:#c98a4b;--caramel-2:#e2aa6c;--ink:#231812;--muted:#7a6656;--line:#eadccb;--ok:#2f7a4a}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.45 Inter,system-ui,sans-serif;background:var(--crema);color:var(--ink);min-height:100svh}
  header{position:sticky;top:0;z-index:5;background:var(--roast);color:var(--crema);padding:calc(14px + env(safe-area-inset-top)) 18px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  header h1{font:800 1.3rem Fraunces,serif;margin:0}
  header small{display:block;color:var(--caramel-2);font-size:.8rem;font-weight:600}
  .hb{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;cursor:pointer}
  .pill{border:1.5px solid rgba(246,236,224,.3);background:none;color:var(--crema);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.88rem}
  .pill.on{background:var(--caramel);border-color:var(--caramel);color:var(--roast)}
  .demo{background:#fff3df;border-bottom:1px solid var(--line);color:var(--muted);font-size:.88rem;padding:10px 18px}
  .alerts{margin:14px 18px 0;background:#fff;border:1.5px solid var(--caramel);border-radius:18px;padding:16px}
  .alerts h2{font:800 1.1rem Fraunces,serif;margin:0 0 4px}
  .alerts p{margin:0 0 10px;color:var(--muted);font-size:.92rem}
  .alerts ol{margin:0 0 6px;padding-left:20px;color:var(--ink);font-size:.95rem}
  .alerts ol li{padding:3px 0;border:0}
  .alerts .row{display:flex;gap:8px;flex-wrap:wrap}
  .big{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--roast);color:var(--crema)}
  .big.alt{background:none;border:1.5px solid var(--line);color:var(--ink)}
  .msg{font-size:.88rem;color:var(--ok);font-weight:600;margin-top:8px}
  .msg.err{color:#a33a2a}
  main{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;align-items:start}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 20px}
  .empty b{display:block;font:800 1.4rem Fraunces,serif;color:var(--ink);margin-bottom:6px}
  .o{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 20px rgba(35,24,18,.07)}
  .o.new{border-color:var(--caramel);box-shadow:0 0 0 4px rgba(201,138,75,.25),0 6px 20px rgba(35,24,18,.07)}
  .o.fresh{animation:pop .5s}
  .o.ready{border-color:var(--ok)}
  .o.done{opacity:.5}
  @keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.02)}100%{transform:none}}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .num{font:800 1.5rem Fraunces,serif}
  .tag{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:var(--caramel);color:var(--roast)}
  .ready .tag{background:var(--ok);color:#fff}
  .done .tag{background:var(--line);color:var(--muted)}
  .who{font-weight:700;margin:2px 0 0}
  .when{color:var(--muted);font-size:.88rem;margin:0 0 10px}
  .o ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  .o li{padding:9px 0;border-bottom:1px solid var(--line)}
  .o li b{display:block}
  .o li small{color:var(--muted)}
  .tot{display:flex;justify-content:space-between;font-weight:700;margin:10px 0 12px}
  .act{width:100%;border:0;border-radius:12px;padding:13px;font-weight:700;background:var(--roast);color:var(--crema)}
  .ready .act{background:var(--ok);color:#fff}
  .done .act{display:none}
  a.act{display:block;text-align:center;text-decoration:none}
  .txt{display:block;text-align:center;margin-top:8px;padding:11px;border-radius:12px;border:1.5px solid var(--ok);color:var(--ok);font-weight:700;text-decoration:none}
  .done .txt{display:none}
  .txt.sent{border-color:var(--line);color:var(--muted);font-weight:600;font-size:.92rem}
</style>
</head>
<body>
<header>
  <div><h1>Orders</h1><small>The Louisiana Bean · Carencro</small></div>
  <div class="hb">
    <button class="pill" id="snd" type="button">🔈 Sound on this screen</button>
    <button class="pill" id="sample" type="button">+ Sample order</button>
    <button class="pill" id="clear" type="button">Clear</button>
  </div>
</header>
<div class="demo">Demo: this is the shop's order screen. Orders placed on the website from any phone land here. No card is charged. Mark ready opens Messages with the ready text to the customer's number, you tap send.</div>

<section class="alerts" id="alerts" aria-live="polite"></section>
<main id="list"><div class="empty"><b>Loading orders…</b></div></main>

<script>
var API='https://api.jobhubgo.com/api/order-demo/louisiana-bean';
var soundOn=false, ctx=null, seen=null, orders=[];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return '$'+(+n).toFixed(2)}
function api(path,opt){return fetch(API+path,Object.assign({cache:'no-store'},opt||{})).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function post(path,data){return api(path,{method:'POST',body:JSON.stringify(data||{})})}

/* ---------- sound on this screen ---------- */
function ding(){
  if(!soundOn||!ctx) return;
  [880,1320].forEach(function(f,i){
    var o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime+i*.18;
    o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.35,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.5);
    o.start(t); o.stop(t+.55);
  });
}
document.getElementById('snd').addEventListener('click',function(){
  soundOn=!soundOn; if(soundOn&&!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} }
  this.textContent=soundOn?'🔊 Sound on':'🔈 Sound on this screen'; this.classList.toggle('on',soundOn); if(soundOn) ding();
});

/* ---------- the order list (from the server, so every device sees the same orders) ---------- */
function smsHref(o){
  var num=o.phone.length===10?'+1'+o.phone:'+'+o.phone;
  var msg='Hi '+o.name+', your order #'+o.num+' is ready at The Louisiana Bean! ☕';
  return 'sms:'+num+(isIOS?'&':'?')+'body='+encodeURIComponent(msg);
}
function clock(ts){return new Date(ts).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'})}
function ago(ts){var m=Math.round((Date.now()-ts)/60000); return m<1?'just now':m+' min ago'}
function paint(){
  var h='', fresh={};
  if(!orders.length) h='<div class="empty"><b>No orders yet</b>Place one on the website, or tap + Sample order.</div>';
  var first=seen===null; if(first) seen={};
  orders.forEach(function(o){ if(!seen[o.id]){ seen[o.id]=1; if(!first&&o.status==='new') fresh[o.id]=1; } });
  orders.forEach(function(o){
    var lab={new:'New',ready:'Ready',done:'Picked up'}[o.status]||'New';
    h+='<article class="o '+esc(o.status)+(fresh[o.id]?' fresh':'')+'"><div class="top"><span class="num">#'+o.num+'</span><span class="tag">'+lab+'</span></div>'
      +'<p class="who">'+esc(o.name)+'</p><p class="when">Placed '+ago(o.placed)+(o.ready?' · ready by '+esc(o.ready):'')+'</p><ul>'
      +o.items.map(function(i){return '<li><b>'+(i.q>1?i.q+' × ':'')+esc(i.n)+'</b><small>'+esc(i.d||'')+'</small></li>'}).join('')
      +'</ul><div class="tot"><span>Paid online</span><span>'+money(o.total)+'</span></div>'
      +(o.status==='new'&&o.phone
          ? '<a class="act" data-id="'+esc(o.id)+'" data-st="new" href="'+esc(smsHref(o))+'">Mark ready · text '+esc(o.name)+'</a>'
          : '<button class="act" type="button" data-id="'+esc(o.id)+'" data-st="'+esc(o.status)+'">'+(o.status==='new'?'Mark ready':'Picked up')+'</button>')
      +(o.status==='ready'&&o.phone?(o.texted
          ? '<a class="txt sent" data-text="'+esc(o.id)+'" href="'+esc(smsHref(o))+'">✓ Texted '+esc(o.name)+' at '+clock(o.texted)+' · send again</a>'
          : '<a class="txt" data-text="'+esc(o.id)+'" href="'+esc(smsHref(o))+'">💬 Text '+esc(o.name)+' it\'s ready</a>'):'')
      +'</article>';
  });
  document.getElementById('list').innerHTML=h;
  if(Object.keys(fresh).length) ding();
}
function load(){ return api('/orders').then(function(j){ orders=j.orders||[]; paint(); }).catch(function(){ if(seen===null){document.getElementById('list').innerHTML='<div class="empty"><b>Can\'t reach the order server</b>Check the connection, it retries by itself.</div>'} }); }
document.getElementById('list').addEventListener('click',function(e){
  var t=e.target.closest('[data-text]');
  if(t){ markTexted(t.dataset.text); return; }
  var b=e.target.closest('.act'); if(!b) return;
  var next=b.dataset.st==='new'?'ready':'done', isLink=b.tagName==='A';
  orders.forEach(function(o){ if(o.id===b.dataset.id) o.status=next });
  if(isLink){ markTexted(b.dataset.id,true); } else paint();
  // Mark ready with a phone is a real sms: link, so the tap itself opens the shop's Messages
  // with the text written (free, from their own number); we only record the status here.
  post('/orders/'+b.dataset.id+'/status',{status:next}).catch(load);
});
function markTexted(id,deferPaint){
  orders.forEach(function(o){ if(o.id===id) o.texted=Date.now() });
  setTimeout(paint,deferPaint?300:150);   // let the Messages link open first
  post('/orders/'+id+'/texted').catch(function(){});
}
document.getElementById('sample').addEventListener('click',function(){
  var names=['Danielle','Marcus','Tre','Brooke','Kayla','Jude'];
  post('/orders',{name:names[Math.floor(Math.random()*names.length)],items:[{n:'Caramel Macchiato',d:'Large, Oat milk, extra shot',q:1},{n:'Bayou Peach',d:'Medium',q:1}],total:14.62,
    ready:new Date(Date.now()+600000).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'})}).then(load);
});
document.getElementById('clear').addEventListener('click',function(){ post('/clear').then(function(){ seen={}; load(); }); });
navigator.serviceWorker&&navigator.serviceWorker.addEventListener('message',function(e){ if(e.data&&e.data.type==='order-push') load(); });
document.addEventListener('visibilitychange',function(){ if(!document.hidden) load(); });
load(); setInterval(load,5000);

/* ---------- alerts on this phone (push notifications) ---------- */
var box=document.getElementById('alerts');
var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
var standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
function b64(s){var p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
function say(t,err){var m=box.querySelector('.msg'); if(m){m.textContent=t;m.classList.toggle('err',!!err)}}
function view(state){
  if(state==='ios-add'){
    box.innerHTML='<h2>Get an alert on this iPhone for every order</h2><p>iPhones only allow alerts from apps on the Home Screen. One time setup:</p>'
      +'<ol><li>Tap the <b>Share</b> button in Safari (the square with the arrow)</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b></li><li>Open <b>LB Orders</b> from your Home Screen</li><li>Tap <b>Turn on order alerts</b></li></ol>';
  } else if(state==='unsupported'){
    box.innerHTML='<h2>Order alerts</h2><p>This browser can\'t show order alerts. Try Safari on iPhone (from the Home Screen) or Chrome.</p>';
  } else if(state==='blocked'){
    box.innerHTML='<h2>Alerts are turned off</h2><p>Notifications were blocked for this app. Turn them on in Settings → Notifications → LB Orders, then come back.</p>';
  } else if(state==='on'){
    box.innerHTML='<h2>✅ Order alerts are on</h2><p>This phone will buzz for every new order, even when it\'s locked.</p><p><b>Make alerts stay on screen</b> until you swipe them: Settings → Notifications → LB Orders → Banner Style → <b>Persistent</b>. Turn on <b>Sounds</b> there too.</p><div class="row"><button class="big" id="testBtn" type="button">Send a test alert</button><button class="big alt" id="sampleBtn" type="button">Place a sample order</button></div><div class="msg"></div>';
    document.getElementById('testBtn').onclick=function(){ say('Sending…'); post('/test').then(function(j){ say(j.sent?'Sent! Lock your phone to see it pop up.':'No phones are signed up yet.', !j.sent) }).catch(function(){ say('Could not send, try again.',true) }) };
    document.getElementById('sampleBtn').onclick=function(){ say('Lock your phone now, the order comes in 5 seconds…'); setTimeout(function(){ document.getElementById('sample').click() },5000) };
  } else {
    box.innerHTML='<h2>Get an alert for every order</h2><p>This phone will buzz with every new order, even when it\'s locked.</p><button class="big" id="onBtn" type="button">Turn on order alerts</button><div class="msg"></div>';
    document.getElementById('onBtn').onclick=turnOn;
  }
}
function turnOn(){
  say('Asking for permission…');
  Notification.requestPermission().then(function(p){
    if(p!=='granted') return view(p==='denied'?'blocked':'ask');
    return navigator.serviceWorker.ready.then(function(reg){
      return api('/vapid').then(function(k){ return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(k.publicKey)}) })
        .then(function(sub){ return post('/subscribe',{subscription:sub.toJSON()}) })
        .then(function(){ view('on') });
    });
  }).catch(function(e){ say('That didn\'t work ('+(e&&e.message||e)+'). Try again.',true) });
}
(function(){
  var can='serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  if(isIOS&&!standalone) return view('ios-add');
  if(!can) return view('unsupported');
  navigator.serviceWorker.register('/sw.js').then(function(reg){
    if(Notification.permission==='denied') return view('blocked');
    return reg.pushManager.getSubscription().then(function(s){
      if(s&&Notification.permission==='granted'){ post('/subscribe',{subscription:s.toJSON()}).catch(function(){}); view('on') } else view('ask');
    });
  }).catch(function(){ view('unsupported') });
})();
</script>
</body>
</html>
